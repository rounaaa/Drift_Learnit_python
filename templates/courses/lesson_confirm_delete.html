{% extends "base.html" %}

{% block title %}Supprimer la leçon — LearnIt{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 3rem auto;">
    <div style="background: white; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-md); text-align: center;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem;">Supprimer la leçon ?</h1>
        <p style="color: var(--text-muted); margin-bottom: 0.75rem;">
            Leçon <strong>#{{ lesson.order }}</strong> du cours <strong>« {{ course.title }} »</strong>
        </p>
        <p style="font-weight: 700; font-size: 1.1rem; background: #f8fafc; border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
            « {{ lesson.title }} »
        </p>
        <form method="POST" style="display: flex; gap: 0.75rem; justify-content: center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">🗑️ Confirmer la suppression</button>
            <a href="{% url 'course_detail' course.pk %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
