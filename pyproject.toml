[project]
name = "learnit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Admin", email = "admin@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.1",
    "celery[redis]>=5.4",
    "google-genai>=2.0",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
]

[project.scripts]
learnit = "learnit:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
